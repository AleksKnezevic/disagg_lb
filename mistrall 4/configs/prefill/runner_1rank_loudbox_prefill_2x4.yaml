# Mistral Small 4 standalone prefill on one 2x4 Blackhole LoudBox.
# The relative descriptor is resolved against TT_METAL_HOME by tt-run.
rank_bindings:
  - {rank: 0, mesh_id: 0, mesh_host_rank: 0, env_overrides: {}}

mesh_graph_desc_path: tt_metal/fabric/mesh_graph_descriptors/p150_x8_mesh_graph_descriptor.textproto

global_env:
  # KMD 2.9.0 hangs while pinning the 1 GiB file-backed embedding upload.
  # A zero cache limit makes large H2D loads use the supported copy fallback.
  TT_METAL_PINNED_MEMORY_CACHE_LIMIT_BYTES: "0"
  PREFILL_MANIFEST: "${TT_METAL_HOME}/models/demos/deepseek_v3_d_p/tt/runners/manifests/mistral4.json"
  MISTRAL4_HF_MODEL: "${MISTRAL4_HF_MODEL}"
  PREFILL_HF_MODEL: "${MISTRAL4_HF_MODEL}"
  PREFILL_TTNN_CACHE: "${PREFILL_TTNN_CACHE}"

  PREFILL_FABRIC_MODE: "2d"
  PREFILL_SP: "2"
  PREFILL_TP: "4"
  PREFILL_CHUNK_SIZE: "5120"
  # Chunked SDPA requires its KV ring to be strictly larger than one Q chunk.
  PREFILL_MAX_SEQ_LEN: "10240"
  PREFILL_NUM_USERS: "1"
  PREFILL_H2D_SERVICE_ID: "ds_prefill"
  PREFILL_GATE_FALLBACK_MODE: "GPT_DEVICE"
  PREFILL_CAPACITY_FACTOR: "8"
  PREFILL_USE_TRACE: "0"

  PREFILL_ENABLE_MIGRATION: "0"
  PREFILL_MIGRATION_EXPORT_TO_FILE: "0"
  LOGURU_LEVEL: "INFO"
